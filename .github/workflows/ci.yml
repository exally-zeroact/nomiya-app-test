name: CI

# push / PR ごとに lint + ロジックテスト(vitest) + 画面E2E(playwright) をクラウドで自動実行。
# ローカルの husky(pre-commit/pre-push)に加えた二重の番人。PCに依存せずチーム全員の push に効く。
on:
  push:
    branches: [main]
  pull_request:
  # ★手で回せる入口（2026-08-07 に追加）★
  #   中身が変わらない push（空コミット）では CI が起動しないことを実測した。
  #   そのせいで「記録が空のコミット」を後から埋める手段が無かった。
  #   これがあれば、任意のコミットに対して後から CI を回して記録を残せる。
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # CI では git フックを動かさない(install時の husky を無効化)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ★見張りの見張り（素の node だけで走る／どのアプリでも同じ）★
      #   check-kit は「何も見ていないのに緑」を防ぐ部品。部品が効いていなければ全部が嘘になる。
      #   ここを飛ばすと ★走らない見張りが repo に居る★ ことになる（アマかせで実際に起きた）。
      - name: check-kit の自己確認（依存ゼロ）
        run: npm run selftest

      # ★試験は 登録するまで 1本も走らない★（指示役 2026-08-22・正本は Rakually／★書き直さない借り物★）
      #   「在る試験」と「走っている試験」を突き合わせる。--self-test も必ず載せる
      #   （見張り自身が嘘をついた事が4回あるので、毎回 わざと壊して赤になるか まで見る）
      - name: 試験が登録されているか（在る＝走る か）
        run: node scripts/tests-registered.mjs

      - name: 試験の登録を数える道具の自己確認
        run: node scripts/tests-registered.mjs --self-test

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit/logic tests (vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
