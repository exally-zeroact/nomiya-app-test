name: CI

# push / PR ごとに lint + ロジックテスト(vitest) + 画面E2E(playwright) をクラウドで自動実行。
# ローカルの husky(pre-commit/pre-push)に加えた二重の番人。PCに依存せずチーム全員の push に効く。
on:
  push:
    branches: [main]
  pull_request:
  # ★手で回せる入口（2026-08-07 に追加）★
  #   中身が変わらない push（空コミット）では CI が起動しないことを実測した。
  #   そのせいで「記録が空のコミット」を後から埋める手段が無かった。
  #   これがあれば、任意のコミットに対して後から CI を回して記録を残せる。
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # CI では git フックを動かさない(install時の husky を無効化)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ★見張りの見張り（素の node だけで走る／どのアプリでも同じ）★
      #   check-kit は「何も見ていないのに緑」を防ぐ部品。部品が効いていなければ全部が嘘になる。
      #   ここを飛ばすと ★走らない見張りが repo に居る★ ことになる（アマかせで実際に起きた）。
      - name: check-kit の自己確認（依存ゼロ）
        run: npm run selftest

      # ★試験は 登録するまで 1本も走らない★（指示役 2026-08-22・正本は Rakually／★書き直さない借り物★）
      #   「在る試験」と「走っている試験」を突き合わせる。--self-test も必ず載せる
      #   （見張り自身が嘘をついた事が4回あるので、毎回 わざと壊して赤になるか まで見る）
      - name: 試験が登録されているか（在る＝走る か）
        run: node scripts/tests-registered.mjs

      - name: 試験の登録を数える道具の自己確認
        run: node scripts/tests-registered.mjs --self-test

      # ★テスト環境の帯★（本番に「テスト環境」と出るのが 一番 危ない）
      #   仕組みの正本は Rakually。飲み屋は 色と言葉だけ自分の物にしている。
      - name: テスト環境の帯（本番に出ない・1画面も漏れない）
        run: npm run envbadge

      - name: 帯の見張りの自己確認
        run: node tests/env-badge.test.mjs --self-test

      # ★repo の 素性と 倉庫の 向き先★（2026-09-12 Rakunally で 本番が テスト倉庫を 指した）
      #   env だけ 見ると 丸ごと 入れ替わった時に 辻褄が 合う ⇒ git の origin と 突き合わせる。
      - name: repoの素性と倉庫の向き先が合っているか
        run: npm run supacfg

      - name: 向き先の見張りの自己確認
        run: node tests/supa-config-env-matches-repo.test.mjs --self-test

      # ★公開 repo に 実在の 字（司さん・会社・お客さんの 本物）を 戻さない★（2026-10-10）
      #   一覧は repo に 置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤。
      #   指紋（変数 KINSHI_JI_FINGER）と 違えば 赤＝secret が 縮んだ・壊れた を 止める。
      #   当たっても 字は 出さない（公開の CI ログは 誰でも 読める）。zip（xlsx 等）は ほどいて 中まで 見る。
      - name: 実在の字が戻っていないか（一覧は secret）
        timeout-minutes: 10
        # 本体が 何も 言わずに 終わる（main が 走らない 等）のを 緑に しない＝終わりの 行が 出たかも 見る
        # shell: bash＝-eo pipefail（書かないと -e だけで、tee の 前の 終わり値が 捨てられる）
        shell: bash
        run: |
          npm run kinshi | tee kinshi.out
          grep -q "^✓ 実在の 字 0 件" kinshi.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}

      - name: 実在の字の見張りの自己確認
        timeout-minutes: 10
        # 全部 通って、しかも 29 組 以上・確かめた 回数 239 以上の 時だけ 緑（組の 中の 歯を 消しても 割れる）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi-self.out
          sh scripts/ci-yuka.sh kinshi-self.out 29 239

      # ★commit の メールを 公開 repo に 出さない 門（.githooks/pre-push）の 自己確認★（2026-10-11）
      #   門は 手元の push で 走る（git config --local core.hooksPath .githooks）。ここでは 門 自身が 壊れていないかを 見る。
      - name: commit のメールの門の自己確認
        shell: bash
        run: |
          node .githooks/pre-push-author.mjs --self-test | tee mail-self.out
          sh scripts/ci-yuka.sh mail-self.out 6

      # ★押す commit の 中身の 門（.githooks/pre-push-kinshi.mjs）の 自己確認★（2026-10-11）
      #   門 自身は 手元の push で 走る。ここでは 門が 壊れていないか（入れて 消した 字を 赤に する 等）を 見る。
      - name: 押す commit の 中身の 門の自己確認
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push-self.out
          sh scripts/ci-yuka.sh push-self.out 13 34

      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit/logic tests (vitest)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright)
        run: npm run test:e2e

      # ★たまに赤の 記録係★（2026-09-06）
      #  ・前は `if: failure()` だった＝★やり直しで通った回（flaky）は 何も残らない★
      #    ＝赤の中身が 次の回で上書きされ、「重かったから」で片づけるしかなくなる。
      #  ・置き場も間違っていた＝reporter は "list" なので `playwright-report/` は
      #    そもそも作られない。★中身が在るのは `test-results/`★（trace: on-first-retry・
      #    screenshot: only-on-failure がここに落ちる）。
      #  ・`always()` + `if-no-files-found: ignore` ＝★1本も落ちなければ 何も上げない★
      #    （全部 緑の回は test-results/ が空なので 重くならない）
      - name: 落ちた回の中身を残す（flaky も／test-results）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          # ★上げるのは「落ちた証拠」だけ★（2026-09-06 実測で 直した）
          #  test-results/ を丸ごとにしたら、★全部 緑の回でも 20,882バイト 上がった★＝
          #  中身は 試験が書き出した out.xlsx / over.xlsx（testInfo.outputPath の物）だった。
          #  ＝★「緑の回は 1件も上げない」は 嘘になっていた★ので、拾う物を 名指しにする。
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

  # ★実在の字の見張りを node 24（ubuntu）でも 回す★（2026-10-11）
  #   node 24.21 の ubuntu で、奇数の 長さの Buffer を toString("utf16le") すると「double free」で process ごと 落ちた
  #   （素の node の 1行で 再現・node 20 は 通る）。見張りは u16le() で 偶数に 揃えて 読む。
  #   本体の 試験は node 20 の まま。ここは 見張りが node 24 でも 落ちない 事だけを 見る（後戻りを 捕まえる）。
  kinshi-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認（node 24 の job）
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

      - name: 実在の字が戻っていないか（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs | tee kinshi24.out
          grep -q "^✓ 実在の 字 0 件" kinshi24.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}
      - name: 実在の字の見張りの自己確認（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi24-self.out
          sh scripts/ci-yuka.sh kinshi24-self.out 29 239
      # 押す commit の 中身の 門も node 24 で（手元の 機械の node は 24・2026-10-11）
      - name: 押す commit の 中身の 門の自己確認（node 24）
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push24-self.out
          sh scripts/ci-yuka.sh push24-self.out 13 34
