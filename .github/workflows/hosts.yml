name: 配信の見張り

# ★「push した・CIが緑」は「客に届いた」ではない★（2026-08-18 指示役／exallyで実際に起きた）
#   GitHub → Vercel の合図が届かず、ビルドが ★始まってすらいない★ ことがある。
#   その間、repo は新しいのに、客の画面は前の版のまま。
#
# ★通常CI(ci.yml)には入れない★
#   外の都合（配信の途中・Vercelの混み）で赤くなると、自分のせいでない赤で push が止まり、
#   赤そのものが信用されなくなる。だから ここは 週1 と 手動 だけ。
#   ★push の直後に回して赤くなるのは正しい★（まだ配信されていない、が見たい物）。
on:
  schedule:
    - cron: "0 22 * * 0" # 毎週月曜 朝7時(日本時間)
  workflow_dispatch:
    inputs:
      host:
        description: "見に行く配信（空なら package.json の名前で決まる）"
        required: false
        default: ""

jobs:
  deployed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ★外へ出る前に、見張りが空振りしていないかを先に見る（通信ゼロ）★
      - name: 見張りの自己確認（外へ出ない）
        run: node scripts/check-deployed-version.mjs --self-test
      - name: 配信を1回だけ見る
        run: node scripts/check-deployed-version.mjs ${{ inputs.host && format('--host {0}', inputs.host) || '' }}
